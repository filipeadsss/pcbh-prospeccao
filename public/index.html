<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM de Prospecção PCBH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: faixa azul da marca no topo, área clara com filtros e quadro kanban de 4 colunas; tema claro fixo */
  --navy:#14386b; --blue:#1d5fb8; --blue-2:#2f7fd1; --sky:#5aaee0; --yellow:#ffc928;
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#f7f9fc; --ink:#14223a; --muted:#61708a; --line:#e1e7f0;
  --real:#15834a; --real-bg:#e6f5ec; --fut:#a86a00; --fut-bg:#fff4dc; --nao:#b3343a; --nao-bg:#fcebec; --novo:#1d5fb8; --novo-bg:#e8f0fb;
  --shadow:0 1px 2px rgba(20,56,107,.06),0 4px 14px rgba(20,56,107,.06);
  --font-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --radius:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font-body);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}

/* Barra de marca */
.brand{background:linear-gradient(100deg,var(--sky) 0%,var(--blue) 45%,var(--navy) 100%);color:#fff;display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.logo img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-text b{font:700 21px/1 var(--font-display);letter-spacing:.3px}
.logo-text small{font-size:13px;opacity:.85;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:6px 12px;display:flex;gap:8px;align-items:baseline;font-size:13px}
.stat b{font:700 19px/1 var(--font-display)}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block;align-self:center;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.brand-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-white{background:#fff;border-color:#fff;color:var(--navy)}
.btn-white:hover{background:#eaf2fd;color:var(--navy);border-color:#eaf2fd}
.btn-outline-white{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn-outline-white:hover{background:rgba(255,255,255,.12);border-color:#fff;color:#fff}
.btn-sm{padding:5px 10px;font-size:13px}

/* Filtros */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.filters input[type=search]{flex:1 1 240px;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.filters input[type=search]:focus,.filters select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--novo-bg)}
.filters select{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);user-select:none}
.chk input{accent-color:var(--blue)}
.sync{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--real)}
.sync.warn{color:var(--nao)}
.sync.warn::before{background:var(--nao)}

/* Quadro */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(280px,1fr));gap:16px;padding:18px 20px 20px;overflow-x:auto}
.col{display:flex;flex-direction:column;min-height:0;background:#eaf0f8;border-radius:var(--radius)}
.col.drop{outline:3px dashed var(--blue);outline-offset:-3px}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.col-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.col-h h2{margin:0;font:700 18px/1.1 var(--font-display);letter-spacing:.2px;text-wrap:balance;color:var(--ink)}
.col-h .count{margin-left:auto;background:var(--surface);color:var(--c);font:700 14px/1 var(--font-display);padding:5px 9px;border-radius:20px;box-shadow:var(--shadow)}
.col-b{flex:1;overflow-y:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px}
.more{align-self:center}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 8px;border:1px dashed #c9d5e6;border-radius:10px}

.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card[draggable=true]{cursor:grab}
.card:hover{border-color:#bcd0ec;border-top-color:var(--c)}
.card-top{display:flex;gap:8px;align-items:flex-start}
.card-name{font:600 15.5px/1.25 var(--font-body);flex:1;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.card-name:hover{color:var(--blue);text-decoration:underline}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:3px 7px;border-radius:5px;background:var(--novo-bg);color:var(--blue);white-space:nowrap}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px}
.links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phone{font:600 15px/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;display:inline-flex;align-items:center;gap:6px}
.phone:hover{border-color:var(--blue);color:var(--blue)}
.phone svg{width:14px;height:14px;opacity:.6}
.phone.copied{border-color:var(--real);color:var(--real);background:var(--real-bg)}
.lnk{font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:7px;border:1px solid var(--blue);text-decoration:none;color:var(--blue);background:var(--surface)}
.lnk:hover{background:var(--blue);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{flex:1 1 auto;font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:7px;border:1px solid var(--blue);background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.act::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px #fff}
.act:hover{background:var(--navy);border-color:var(--navy)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act.na{background:var(--surface);color:var(--blue)}
.act.na::before{display:none}
.act.na:hover{background:var(--novo-bg)}
.hours{display:flex;flex-direction:column;gap:2px;padding:7px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.h-status{font-weight:600;display:flex;align-items:center;gap:6px}
.h-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.h-today{color:var(--muted);font-variant-numeric:tabular-nums}
.h-aberto{background:var(--real-bg);border-color:#bfe3cd}.h-aberto .h-status{color:var(--real)}.h-aberto .h-status::before{background:var(--real)}
.h-abre{background:var(--fut-bg);border-color:#f3d79c}.h-abre .h-status{color:var(--fut)}.h-abre .h-status::before{background:var(--fut)}
.h-fechado .h-status{color:var(--nao)}.h-fechado .h-status::before{background:var(--nao)}
.h-sem .h-status{color:var(--muted);font-weight:500}
.lnk-muted{border-color:var(--line);color:var(--muted);background:var(--surface);cursor:pointer}
.lnk-muted:hover{background:var(--novo-bg);color:var(--blue);border-color:var(--blue)}
.week{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:13.5px}
.week li{display:flex;justify-content:space-between;gap:12px;padding:2px 6px;border-radius:5px}
.week li.today{background:var(--novo-bg);font-weight:600;color:var(--blue)}
.note-line{font-size:13px;color:var(--ink);background:var(--surface-2);border-left:3px solid var(--line);border-radius:4px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.attempts{font-size:12px;color:var(--fut);font-weight:600}
.who{font-size:12px;color:var(--muted)}

.s-novo{--c:var(--novo);--cbg:var(--novo-bg)}
.s-futuro{--c:var(--fut);--cbg:var(--fut-bg)}
.s-real{--c:var(--real);--cbg:var(--real-bg)}
.s-nao{--c:var(--nao);--cbg:var(--nao-bg)}
.a-novo{--ac:#9cc3f5}
.a-futuro{--ac:#ffc928}
.a-real{--ac:#3ad07c}
.a-nao{--ac:#ff7a80}

/* Modais */
.overlay{position:fixed;inset:0;background:rgba(20,40,75,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.open{display:flex}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 24px 60px rgba(20,56,107,.3);display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);border-top:4px solid var(--blue);border-radius:14px 14px 0 0}
.modal-h h3{margin:0;font:700 21px/1.15 var(--font-display);text-wrap:balance;flex:1}
.x{border:0;background:none;font-size:24px;line-height:1;padding:2px 8px;color:var(--muted)}
.modal-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font:700 15px/1 var(--font-display);padding:0 4px}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px}
.opt input{accent-color:var(--blue)}
.opt{display:flex;align-items:flex-start;gap:7px;font-size:14px}
.opt small{display:block;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 160px}
.row select,.row input{accent-color:var(--blue);padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.preview{font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.preview b{font-variant-numeric:tabular-nums}
.msg{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--novo-bg)}
.msg.err{background:var(--nao-bg);color:var(--nao)}
textarea{width:100%;min-height:90px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);resize:vertical}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere}

/* Modo discagem */
.dial{width:min(560px,100%)}
.dial-name{font:800 28px/1.1 var(--font-display);margin:0;text-wrap:balance}
.dial-phone{font:700 32px/1 var(--font-display);font-variant-numeric:tabular-nums;align-self:flex-start;padding:8px 14px}
.dial-phone svg{width:20px;height:20px}
.dial-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dial-acts .act{font-size:15px;padding:13px 8px}
kbd{font:600 11px/1 var(--font-body);border:1px solid currentColor;border-radius:4px;padding:1px 4px;opacity:.75;margin-left:4px}
.progress{font-size:13px;color:var(--muted)}

.login{position:fixed;inset:0;z-index:40;background:linear-gradient(135deg,var(--sky),var(--blue) 50%,var(--navy));display:flex;align-items:center;justify-content:center;padding:16px}
.login[hidden]{display:none}
.login-box{background:#fff;border-radius:16px;padding:28px 26px;width:min(380px,100%);display:flex;flex-direction:column;gap:8px;box-shadow:0 24px 60px rgba(10,30,70,.35)}
.login-box img{align-self:center;border-radius:50%}
.login-box h1{margin:4px 0 0;text-align:center;font:700 26px/1.1 var(--font-display);color:var(--navy)}
.login-box p{margin:0 0 6px;text-align:center;color:var(--muted);font-size:14px}
.login-box .lg-err{color:var(--nao);background:var(--nao-bg);border-radius:8px;padding:8px;margin:4px 0 0}
.login-box label{font-size:13px;font-weight:600;color:var(--ink);margin-top:4px}
.login-box input{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.login-box input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--novo-bg)}
.login-box .btn{justify-content:center;margin-top:10px;padding:11px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:14px;display:none;gap:10px;align-items:center;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{display:flex}
.toast button{background:#fff;color:var(--blue);border:0;border-radius:6px;padding:3px 9px;font-weight:700}

@media (max-width:700px){
  .board{grid-template-columns:repeat(4,86vw);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .stats{margin-left:0;width:100%}
  .sync{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<!-- Exportar -->
<div class="overlay" id="ovExport" role="dialog" aria-modal="true" aria-labelledby="expTitle">
  <div class="modal">
    <div class="modal-h"><h3 id="expTitle">Exportar leads</h3><button class="x" type="button" data-close aria-label="Fechar">×</button></div>
    <div class="modal-b">
      <fieldset>
        <legend>Qual lista</legend>
        <div class="opts" id="expLists"></div>
      </fieldset>
      <fieldset>
        <legend>Formato do arquivo</legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="fmt" value="meta" checked><span>Público do Meta Ads<small>Lista de clientes: telefone +55, cidade, estado, país</small></span></label>
          <label class="opt"><input type="radio" name="fmt" value="crm"><span>Importar no CRM PCBH<small>Nome, número 55DDD, etiqueta e observação</small></span></label>
          <label class="opt"><input type="radio" name="fmt" value="full"><span>Planilha completa (Excel)<small>Todos os campos + data de retomada</small></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Filtros da exportação</legend>
        <div class="row">
          <label>Nicho<select id="eNicho"><option value="">Todos</option></select></label>
          <label>Cidade<select id="eCidade"><option value="">Todas</option></select></label>
          <label>Retomar contato em<select id="eFollow">
            <option value="auto">Padrão da lista</option>
            <option value="0">Não calcular</option>
            <option value="3">3 meses</option>
            <option value="6">6 meses</option>
            <option value="12">1 ano</option>
          </select></label>
        </div>
        <label class="chk"><input type="checkbox" id="eCel"> Só números de celular</label>
        <label class="chk"><input type="checkbox" id="eDue"> Só quem já está na hora de retomar</label>
      </fieldset>
      <div class="preview" id="expPreview"></div>
      <div class="msg" id="expMsg" hidden></div>
    </div>
    <div class="modal-f">
      <button class="btn" type="button" id="expCopy">Copiar como texto</button>
      <button class="btn btn-primary" type="button" id="expGo">Baixar CSV</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const NICHO={P:"Pizzaria",H:"Hamburgueria",L:"Lanchonete",R:"Restaurante",F:"Farmácia"};
const SITE={N:"Sem site",I:"Só Instagram",L:"Só Linktree",F:"Só Facebook",W:"Só WhatsApp",D:"Cardápio digital",S:"Site próprio"};
const ST=[
  {k:"novo",label:"Novo lead",short:"Novo"},
  {k:"futuro",label:"Interesse futuro",short:"Futuro",follow:3},
  {k:"real",label:"Interesse real",short:"Interesse real",follow:0},
  {k:"nao",label:"Não tem interesse",short:"Sem interesse",follow:6}
];
const STK=Object.fromEntries(ST.map(s=>[s.k,s]));
const PAGE=60;

const raw=JSON.parse(document.getElementById("leadsData").textContent);
const LEADS=raw.map(r=>({id:r[0],ni:r[1],nome:r[2],cidade:r[3],bairro:r[4],rua:r[5],tel:r[6],tp:r[7],nota:r[8],nrev:r[9],sk:r[10],site:r[11],ig:r[12],h:r[13]||null}));
const BYID=new Map(LEADS.map(l=>[l.id,l]));

let state={};          // id -> {st,at,por,notas,tent,hist}
let db=null, myId=null, canWrite=true, names={};
let shown={novo:PAGE,futuro:PAGE,real:PAGE,nao:PAGE};
let undo=null;

const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}for(const c of kids){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;};

function fmtTel(d){if(!d)return"";return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d;}
const ICON_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
function phoneBtn(l,extra){
  const b=el("button",{type:"button",class:"phone"+(extra?" "+extra:""),title:"Clique para copiar 55"+l.tel+" (pronto para colar no Whazing)"},fmtTel(l.tel));
  b.insertAdjacentHTML("beforeend",ICON_COPY);
  b.addEventListener("click",async e=>{e.stopPropagation();const v="55"+l.tel;let ok=false;
    try{await navigator.clipboard.writeText(v);ok=true;}catch(_){try{const ta=document.createElement("textarea");ta.value=v;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();ok=document.execCommand("copy");ta.remove();}catch(__){}}
    if(ok){b.classList.add("copied");setTimeout(()=>b.classList.remove("copied"),1500);showToast(`Número ${v} copiado`);}else showToast("Não consegui copiar. Selecione o número e use Ctrl+C.");});
  return b;
}
/* horário de funcionamento: h = 7 textos, índice 0 = segunda ... 6 = domingo */
const DIAS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
function dayIdx(d){return(d.getDay()+6)%7;}
function slotsOf(txt){if(!txt)return null;const t=txt.toLowerCase();if(t.includes("fechado"))return[];if(t.includes("24 horas"))return[[0,1440]];
  const out=[];for(const m of txt.matchAll(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/g)){const a=+m[1]*60+ +m[2];let b=+m[3]*60+ +m[4];if(b<=a)b+=1440;out.push([a,b]);}return out.length?out:null;}
function hhmm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function openInfo(l,now=new Date()){
  if(!l.h)return{k:"sem",txt:"Horário não informado no Google",today:""};
  const di=dayIdx(now),mins=now.getHours()*60+now.getMinutes();
  const today=slotsOf(l.h[di]),yest=slotsOf(l.h[(di+6)%7]);
  if(yest)for(const[a,b]of yest){if(b>1440&&mins<b-1440)return{k:"aberto",txt:`Aberto agora · fecha às ${hhmm(b)}`,today:l.h[di]};}
  if(today){for(const[a,b]of today){if(mins>=a&&mins<b)return{k:"aberto",txt:`Aberto agora · fecha às ${hhmm(b)}`,today:l.h[di]};}
    const next=today.find(([a])=>a>mins);if(next)return{k:"abre",txt:`Abre hoje às ${hhmm(next[0])}`,today:l.h[di]};}
  for(let i=1;i<=7;i++){const s=slotsOf(l.h[(di+i)%7]);if(s&&s.length)return{k:"fechado",txt:`Fechado · abre ${i===1?"amanhã":DIAS[(di+i)%7].toLowerCase()} às ${hhmm(s[0][0])}`,today:l.h[di]};}
  return{k:"sem",txt:"Sem horário de abertura",today:l.h[di]||""};

    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
    expMsg(`${r.count} leads exportados em ${r.filename}.`);
  }catch(e){expMsg("O navegador bloqueou o download. Use ‘Copiar como texto’.",true);}
});
$("#expCopy").addEventListener("click",async()=>{
  const r=buildCsv();
  try{await navigator.clipboard.writeText(r.txt.replace(/^﻿/,""));expMsg(`${r.count} linhas copiadas. Cole numa planilha ou salve como .csv.`);}
  catch(e){expMsg("O navegador bloqueou a cópia. Use ‘Baixar CSV’.",true);}
});

/* banco compartilhado (Supabase) */
render();
setInterval(()=>{if(!document.querySelector(".overlay.open"))render();},60000);
function showLogin(msg){$("#login").hidden=false;$("#lgMsg").textContent=msg||"";$("#lgMsg").hidden=!msg;setTimeout(()=>$("#lgEmail").focus(),50);}
function hideLogin(){$("#login").hidden=true;}
async function loadNames(){try{const {data}=await db.rpc("team_names");if(data)for(const r of data)names[r.email]=r.nome||r.email.split("@")[0];}catch(e){}}
let channel=null;
async function startData(){
  const timer=setTimeout(()=>setSync("Não consegui falar com o banco ainda. As marcações podem estar desatualizadas.",true),10000);
  const {data:role,error:rerr}=await db.rpc("my_role");
  if(rerr||!role){clearTimeout(timer);await db.auth.signOut();showLogin("Este e-mail não tem acesso ao CRM. Peça ao Filipe para liberar.");return;}
  hideLogin();$("#btnSair").hidden=false;
  await loadNames();
  const next={};let from=0;
  while(true){
    const {data,error}=await db.from("docs").select("id,data").eq("collection","estado").range(from,from+999);
    if(error){clearTimeout(timer);setSync("Não consegui carregar as marcações ("+(error.message||"erro")+"). Recarregue a página.",true);return;}
    for(const d of data)if(BYID.has(d.id))next[d.id]=d.data;
    if(data.length<1000)break;from+=1000;
  }
  state=next;clearTimeout(timer);
  setSync(`Salvo e sincronizado · ${Object.keys(state).length} leads com marcação`);render();
  if(channel)db.removeChannel(channel);
  channel=db.channel("estado").on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"collection=eq.estado"},async p=>{
    if(p.eventType==="DELETE"){if(p.old&&p.old.id)delete state[p.old.id];}
    else if(p.new&&BYID.has(p.new.id))state[p.new.id]=p.new.data;
    const por=p.new&&p.new.data&&p.new.data.por;if(por&&!(por in names))await loadNames();
    render();
  }).subscribe(s=>{if(s==="CHANNEL_ERROR"||s==="TIMED_OUT")setSync("A atualização em tempo real caiu. Recarregue a página para ver as marcações das colegas.",true);});
}
$("#lgForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!db)return;
  const btn=$("#lgBtn");btn.disabled=true;btn.textContent="Entrando…";
  const {data,error}=await db.auth.signInWithPassword({email:$("#lgEmail").value.trim(),password:$("#lgSenha").value});
  btn.disabled=false;btn.textContent="Entrar";
  if(error){showLogin("E-mail ou senha incorretos.");return;}
  myId=data.user.email.toLowerCase();await startData();
});
$("#btnSair").addEventListener("click",async()=>{if(db)await db.auth.signOut();location.reload();});
(async function init(){
  const cfg=window.PCBH_CONFIG||{};
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){canWrite=false;setSync("Configuração pendente: defina SUPABASE_URL e SUPABASE_ANON_KEY na Vercel.",true);render();return;}
  if(!window.supabase){canWrite=false;setSync("Não consegui carregar a biblioteca do banco. Verifique a internet e recarregue.",true);render();return;}
  db=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const {data}=await db.auth.getSession();
  if(data&&data.session){myId=data.session.user.email.toLowerCase();await startData();}
  else{setSync("Entre com seu e-mail para começar.");showLogin();}
})();
})();
</script>
